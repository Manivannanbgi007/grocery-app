# Jaeger v2: receives the traces of all services and shows them in its UI (http://localhost:16686).
# Jaeger v2 is built on the OpenTelemetry Collector, so this file has the Collector's sections:
#   receivers  -> how traces come in        (OTLP: the services send here, see management.opentelemetry in application.yml)
#   processors -> what happens on the way   (tail_sampling: drop monitoring noise; batch: write in groups, cheaper)
#   exporters  -> where they go             (Jaeger's own storage)
#   extensions -> the rest of Jaeger        (storage, the query API + UI, health check)
# Local development: traces are kept in memory (lost on restart, at most max_traces).
# Production: a persistent backend (Elasticsearch/OpenSearch, Cassandra or ClickHouse) instead of "memory".

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling, batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    metrics:                          # Jaeger's own metrics (spans received, dropped ...), scraped by Prometheus
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: info

extensions:
  healthcheckv2:                      # http://localhost:13133/status (docker-compose healthcheck)
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133

  jaeger_storage:
    backends:
      traces_in_memory:
        memory:
          max_traces: 50000           # the oldest traces are dropped beyond this (keeps memory bounded)

  jaeger_query:                       # the API and the UI on port 16686 (Grafana's Jaeger data source uses the API)
    storage:
      traces: traces_in_memory

receivers:
  otlp:                               # OpenTelemetry protocol: what Spring Boot's OTLP exporter sends
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318        # the services use HTTP: http://localhost:4318/v1/traces

processors:
  # Prometheus (/actuator/prometheus) and the health checks (/actuator/health) call every service every 15 s.
  # Their traces would be ~40 % of all traces and hide the real requests, so they are dropped here.
  # "Tail" sampling decides per trace after its spans have arrived (decision_wait), so the spans inside such a
  # request (e.g. the Redis call of a health check) are dropped with it. That is why a trace shows up in the
  # UI about 10 s after the request.
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    decision_cache:
      sampled_cache_size: 100000          # spans arriving after the decision follow it
      non_sampled_cache_size: 100000
    policies:
      - name: drop-actuator-requests
        type: string_attribute
        string_attribute:
          key: uri                        # the endpoint of a request span, e.g. /actuator/health
          values: ["/actuator.*"]
          enabled_regex_matching: true
          invert_match: true              # a match means "do not keep"; every other trace is kept

  batch: {}

exporters:
  jaeger_storage_exporter:
    trace_storage: traces_in_memory
