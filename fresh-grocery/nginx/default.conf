# NGINX inside the fresh-grocery image: serves the built shop (dist/).
# The API (/api, /media, /delivery-media) never reaches this server: the Kubernetes Gateway sends it to the API gateway.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Built files have a hash in their name (assets/index-3f9a1c.js) and never change: browsers may keep them a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The super admin's System page asks Prometheus through /prometheus (only the Vite dev server forwards it, to
    # localhost:9090). Here there is no Prometheus: a clear 503, so the page says "Prometheus did not answer".
    location /prometheus/ {
        return 503;
    }

    # Every other path is a page of the React app (/shop, /vendor/orders ...): the browser gets index.html and
    # React Router shows the page. index.html is never cached, so a new version of the shop is picked up at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
