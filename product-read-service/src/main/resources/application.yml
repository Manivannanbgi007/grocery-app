# =====================================================================
# product-read-service configuration (READ side of the catalog)
#
# This service has NO MySQL database. It keeps an Elasticsearch copy of
# product_db, fed by Debezium change events from Kafka, and answers every
# product/category GET request from that copy.
# =====================================================================

server:
  port: ${SERVER_PORT:8105}
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true   # Tomcat's thread metrics (tomcat_threads_busy_threads ...) for Grafana and alerts

spring:
  application:
    name: product-read-service
  profiles:
    default: local        # used when no profile is set, e.g. when you press Run in the IDE

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    # Fail fast instead of holding a web thread when Elasticsearch is down or stuck (the defaults are 1 s and 30 s):
    # a search answers in milliseconds; 5 s is the most a busy cluster may take before the caller gets an error.
    connection-timeout: ${ELASTICSEARCH_CONNECTION_TIMEOUT:2s}
    socket-timeout: ${ELASTICSEARCH_SOCKET_TIMEOUT:5s}

  # Kafka: this service CONSUMES the Debezium change topics cdc.product_db.*
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    listener:
      observation-enabled: true      # a span per event, continuing the trace from the "traceparent" header
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest      # a new consumer group starts from the oldest change = full rebuild
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: false    # Debezium rows have no generated class: read them as GenericRecord

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}     # share of requests that are traced (lower it in production)
    export:
      otlp:
        enabled: ${TRACING_EXPORT_ENABLED:false}            # true when Jaeger runs (start-infra.ps1 -Profiles monitoring)
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}   # Jaeger's OTLP receiver (HTTP)
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true   # response-time buckets: p95/p99 in Grafana and alerts, sample requests link to traces
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true     # /actuator/health/liveness and /actuator/health/readiness (Kubernetes probes)

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    correlation: "[%X{correlationId:-}] [%X{traceId:-}] "   # correlation id (CorrelationIdFilter) and trace id in every log line

app:
  # Logging (logback-spring.xml, docs/observability.md)
  logging:
    format: ${LOG_FORMAT:text}   # console: text (people) or json (ECS, one object per line, for a log collector)
    # LoggingAspect (logging/LoggingAspect.java): calls that take longer are logged as WARN "SLOW"
    slow-call-threshold: ${LOG_SLOW_CALL_THRESHOLD:1s}
    loki:
      enabled: ${LOKI_ENABLED:false}                             # true = also push every log line to Grafana Loki
      url: ${LOKI_URL:http://localhost:3100/loki/api/v1/push}    # Loki's push API (start-infra.ps1 -Profiles monitoring)
      environment: ${LOKI_ENVIRONMENT:local}                     # the "env" label in Loki: local, test, prod ...
