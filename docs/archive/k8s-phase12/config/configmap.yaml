# Settings every service reads (each service only uses the ones it needs).
# These values run the services in a LOCAL cluster (kind / Docker Desktop) against the Docker Compose infrastructure
# on your machine. For a real environment, point them at the managed MySQL, Kafka, Redis ... and use the "prod" profile.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grocery-config
  labels:
    app.kubernetes.io/part-of: grocery
data:
  # "local" = also load the seed data (the local databases already contain it). Use "prod" with empty databases.
  SPRING_PROFILES_ACTIVE: local
  MYSQL_HOST: host.docker.internal
  MYSQL_PORT: "3307"
  KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:9094      # Kafka's listener for containers (see docker-compose.yml)
  SCHEMA_REGISTRY_URL: http://host.docker.internal:8081
  REDIS_HOST: host.docker.internal
  REDIS_PORT: "6379"
  ELASTICSEARCH_URIS: http://host.docker.internal:9200
  MAIL_HOST: host.docker.internal
  MAIL_PORT: "1025"
  PUBLIC_BASE_URL: http://localhost:8080                 # how browsers reach the gateway (image and photo URLs)
  CORS_ALLOWED_ORIGINS: http://localhost:5173
  # Traces to Jaeger (OTLP over HTTP). "true" once Jaeger runs (start-infra.ps1 -Profiles monitoring).
  # In production: the OpenTelemetry Collector or Jaeger of the cluster, and a lower sampling probability (e.g. 0.1).
  # Live delivery tracking (delivery-service): an OSRM-compatible routing server for the route along the streets and the
  # arrival time. Empty = off (the map draws a straight line, no arrival time). docs/delivery-tracking.md
  TRACKING_ROUTING_URL: ""
  TRACING_SAMPLING_PROBABILITY: "1.0"
  TRACING_EXPORT_ENABLED: "false"
  OTLP_TRACING_ENDPOINT: http://host.docker.internal:4318/v1/traces
  # Logs to Grafana Loki (logback-spring.xml of every service). "true" once Loki runs (start-infra.ps1 -Profiles monitoring);
  # with "false" the logs go only to the console (kubectl logs).
  LOKI_ENABLED: "false"
  LOKI_URL: http://host.docker.internal:3100/loki/api/v1/push
  LOKI_ENVIRONMENT: kind                                 # the "env" label in Loki, to tell this cluster's logs apart
  # (LOG_SLOW_CALL_THRESHOLD is not set here on purpose: 1s by default, 60s in mcp-client-service)
