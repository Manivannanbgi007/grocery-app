# kubectl apply -k k8s   (applies everything below into the namespace "grocery")
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - namespace.yaml
  - config/configmap.yaml
  - config/secret.yaml
  - services/api-gateway.yaml
  - services/auth-service.yaml
  - services/customer-service.yaml
  - services/store-service.yaml
  - services/product-service.yaml
  - services/product-read-service.yaml
  - services/inventory-service.yaml
  - services/cart-service.yaml
  - services/order-service.yaml
  - services/payment-service.yaml
  - services/delivery-service.yaml
  - services/notification-service.yaml
  - services/report-service.yaml
  - services/platform-service.yaml
  - services/mcp-server-service.yaml
  - services/mcp-client-service.yaml
  - ingress.yaml
