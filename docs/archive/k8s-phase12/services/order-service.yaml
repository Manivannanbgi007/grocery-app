# order-service: PersistentVolumeClaim (the stored invoice PDFs) + Deployment (the running pods)
#                + Service (a stable name inside the cluster: http://order-service)
#
# Invoices are documents that must be kept, so unlike delivery-service's photos (emptyDir) they live on a
# persistent volume that survives pod restarts and new versions. ReadWriteOnce = one node at a time: with more than
# one replica use storage that many pods can share (ReadWriteMany: NFS, EFS, Azure Files ...) and drop "Recreate".
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: order-invoices
  labels:
    app: order-service
    app.kubernetes.io/part-of: grocery
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi                       # an invoice is about 2-5 KB
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
    app.kubernetes.io/part-of: grocery
spec:
  replicas: 1
  strategy:
    type: Recreate                       # stop the old pod first: a ReadWriteOnce volume cannot be in two pods at once
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        app.kubernetes.io/part-of: grocery
      annotations:                       # a Prometheus in the cluster finds the metrics through these
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsUser: 10001                 # the "spring" user of the image (Dockerfile)
        fsGroup: 10001                   # the volume is made writable for this group
      containers:
        - name: order-service
          image: grocery/order-service:0.0.1
          imagePullPolicy: IfNotPresent      # images are built locally and loaded into the cluster
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: grocery-config         # shared: profile, MySQL host, Kafka, Schema Registry, Redis, tracing ...
          env:
            - name: DB_URL
              value: "jdbc:mysql://$(MYSQL_HOST):$(MYSQL_PORT)/order_db?allowPublicKeyRetrieval=true&useSSL=false"
            - name: DB_USERNAME
              value: order_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: ORDER_DB_PASSWORD
            - name: CART_SERVICE_URL
              value: "http://cart-service"
            - name: CUSTOMER_SERVICE_URL
              value: "http://customer-service"
            - name: STORE_SERVICE_URL
              value: "http://store-service"
            - name: INVOICE_STORAGE_DIR
              value: /app/invoices
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 640Mi                  # the JVM uses 75 % of it as heap (-XX:MaxRAMPercentage=75 in the Dockerfile)
          # Spring Boot's health groups (management.endpoint.health.probes.enabled=true)
          startupProbe:                      # give the app up to 3 minutes to start (Flyway, Kafka ...)
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:                     # stuck? -> restart the container
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:                    # not ready (starting, shutting down)? -> no traffic from the Service
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: invoices
              mountPath: /app/invoices
      volumes:
        - name: invoices
          persistentVolumeClaim:
            claimName: order-invoices
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: order-service
    app.kubernetes.io/part-of: grocery
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 80
      targetPort: http
