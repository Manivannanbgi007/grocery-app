# product-service: Deployment (the running pods) + Service (a stable name inside the cluster: http://product-service)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  labels:
    app: product-service
    app.kubernetes.io/part-of: grocery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
        app.kubernetes.io/part-of: grocery
      annotations:                       # a Prometheus in the cluster finds the metrics through these
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: product-service
          image: grocery/product-service:0.0.1
          imagePullPolicy: IfNotPresent      # images are built locally and loaded into the cluster
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: grocery-config         # shared: profile, MySQL host, Kafka, Schema Registry, Redis, tracing ...
          env:
            - name: DB_URL
              value: "jdbc:mysql://$(MYSQL_HOST):$(MYSQL_PORT)/product_db?allowPublicKeyRetrieval=true&useSSL=false"
            - name: DB_USERNAME
              value: product_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: PRODUCT_DB_PASSWORD
            - name: ORDER_SERVICE_URL
              value: "http://order-service"
            - name: MEDIA_PUBLIC_BASE_URL
              value: "$(PUBLIC_BASE_URL)/media"
            - name: MEDIA_UPLOAD_DIR
              value: /app/uploads
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 640Mi                  # the JVM uses 75 % of it as heap (-XX:MaxRAMPercentage=75 in the Dockerfile)
          # Spring Boot's health groups (management.endpoint.health.probes.enabled=true)
          startupProbe:                      # give the app up to 3 minutes to start (Flyway, Kafka ...)
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:                     # stuck? -> restart the container
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:                    # not ready (starting, shutting down)? -> no traffic from the Service
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          emptyDir: {}            # uploaded images live as long as the pod; use object storage (S3) in production
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  labels:
    app: product-service
    app.kubernetes.io/part-of: grocery
spec:
  selector:
    app: product-service
  ports:
    - name: http
      port: 80
      targetPort: http
