# mcp-server-service: the AI assistant's tools (MCP). Deployment + Service (http://mcp-server-service) + a NetworkPolicy:
# only mcp-client-service pods may call it (the API gateway does not route to it either).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server-service
  labels:
    app: mcp-server-service
    app.kubernetes.io/part-of: grocery
spec:
  replicas: 1                                # stateless MCP: more replicas need no sticky sessions
  selector:
    matchLabels:
      app: mcp-server-service
  template:
    metadata:
      labels:
        app: mcp-server-service
        app.kubernetes.io/part-of: grocery
      annotations:                       # a Prometheus in the cluster finds the metrics through these
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: mcp-server-service
          image: grocery/mcp-server-service:0.0.1
          imagePullPolicy: IfNotPresent      # images are built locally and loaded into the cluster
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: grocery-config         # shared: profile, tracing ...
          env:
            - name: API_GATEWAY_URL          # every tool reads its data through the gateway, like the website
              value: "http://api-gateway"
            - name: MCP_API_KEY              # the shared secret; mcp-client-service sends the same value
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: MCP_API_KEY
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 640Mi                  # the JVM uses 75 % of it as heap (-XX:MaxRAMPercentage=75 in the Dockerfile)
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server-service
  labels:
    app: mcp-server-service
    app.kubernetes.io/part-of: grocery
spec:
  selector:
    app: mcp-server-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Network rule: only mcp-client-service pods may open connections to mcp-server-service (a second lock next to the
# API key). Enforced only when the cluster's network plugin supports NetworkPolicy (Calico, Cilium, recent kind ...);
# kubelet health probes are not affected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-server-service
  labels:
    app.kubernetes.io/part-of: grocery
spec:
  podSelector:
    matchLabels:
      app: mcp-server-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: mcp-client-service
      ports:
        - port: http
