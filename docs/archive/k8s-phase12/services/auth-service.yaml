# auth-service: Deployment (the running pods) + Service (a stable name inside the cluster: http://auth-service)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
    app.kubernetes.io/part-of: grocery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        app.kubernetes.io/part-of: grocery
      annotations:                       # a Prometheus in the cluster finds the metrics through these
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: auth-service
          image: grocery/auth-service:0.0.1
          imagePullPolicy: IfNotPresent      # images are built locally and loaded into the cluster
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: grocery-config         # shared: profile, MySQL host, Kafka, Schema Registry, Redis, tracing ...
          env:
            - name: DB_URL
              value: "jdbc:mysql://$(MYSQL_HOST):$(MYSQL_PORT)/auth_db?allowPublicKeyRetrieval=true&useSSL=false"
            - name: DB_USERNAME
              value: auth_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: AUTH_DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: JWT_SECRET
            - name: PASSWORD_RESET_EVENT_KEY       # the same key as notification-service's
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: PASSWORD_RESET_EVENT_KEY
            # Social login (docs/social-login.md): off until "true"; the address people open the shop at (the providers'
            # redirect addresses are built from it), and each provider's credentials (empty in the Secret: no button)
            - name: SOCIAL_LOGIN_ENABLED
              value: "false"
            - name: APP_PUBLIC_URL
              value: http://localhost:5173
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: MICROSOFT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: MICROSOFT_CLIENT_ID
            - name: MICROSOFT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: MICROSOFT_CLIENT_SECRET
            - name: FACEBOOK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: FACEBOOK_CLIENT_ID
            - name: FACEBOOK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: FACEBOOK_CLIENT_SECRET
            - name: APPLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: APPLE_CLIENT_ID
            - name: APPLE_TEAM_ID
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: APPLE_TEAM_ID
            - name: APPLE_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: APPLE_KEY_ID
            - name: APPLE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: APPLE_PRIVATE_KEY
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 640Mi                  # the JVM uses 75 % of it as heap (-XX:MaxRAMPercentage=75 in the Dockerfile)
          # Spring Boot's health groups (management.endpoint.health.probes.enabled=true)
          startupProbe:                      # give the app up to 3 minutes to start (Flyway, Kafka ...)
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:                     # stuck? -> restart the container
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:                    # not ready (starting, shutting down)? -> no traffic from the Service
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    app: auth-service
    app.kubernetes.io/part-of: grocery
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 80
      targetPort: http
