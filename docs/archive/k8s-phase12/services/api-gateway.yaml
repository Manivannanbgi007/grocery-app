# api-gateway: Deployment (the running pods) + Service (a stable name inside the cluster: http://api-gateway)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: grocery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/part-of: grocery
      annotations:                       # a Prometheus in the cluster finds the metrics through these
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: api-gateway
          image: grocery/api-gateway:0.0.1
          imagePullPolicy: IfNotPresent      # images are built locally and loaded into the cluster
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: grocery-config         # shared: profile, MySQL host, Kafka, Schema Registry, Redis, tracing ...
          env:
            - name: AUTH_SERVICE_URL
              value: "http://auth-service"
            - name: CUSTOMER_SERVICE_URL
              value: "http://customer-service"
            - name: STORE_SERVICE_URL
              value: "http://store-service"
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service"
            - name: PRODUCT_READ_SERVICE_URL
              value: "http://product-read-service"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service"
            - name: CART_SERVICE_URL
              value: "http://cart-service"
            - name: ORDER_SERVICE_URL
              value: "http://order-service"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service"
            - name: DELIVERY_SERVICE_URL
              value: "http://delivery-service"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service"
            - name: REPORT_SERVICE_URL
              value: "http://report-service"
            - name: PLATFORM_SERVICE_URL
              value: "http://platform-service"
            - name: MCP_CLIENT_SERVICE_URL     # the AI shopping assistant (mcp-server-service is not routed)
              value: "http://mcp-client-service"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: JWT_SECRET
            - name: REDIS_USERNAME             # a Redis user that may only use the rate-limit keys
              value: gateway
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: REDIS_GATEWAY_PASSWORD
            # Rate limiting per client IP: behind the Ingress every request comes from the ingress controller's pod,
            # so the client's IP is taken from the X-Forwarded-For entry the Ingress added (1 trusted proxy).
            # Without that header (kubectl port-forward) the connection's address is used.
            - name: RATE_LIMIT_TRUSTED_PROXIES
              value: "1"
            # Rate limits are shared by all replicas (Redis). Circuit breakers and the bulkhead (100 requests in
            # progress per route) count per pod - see api-gateway/README.md "Resilience and traffic control".
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 640Mi                  # the JVM uses 75 % of it as heap (-XX:MaxRAMPercentage=75 in the Dockerfile)
          # Spring Boot's health groups (management.endpoint.health.probes.enabled=true)
          startupProbe:                      # give the app up to 3 minutes to start (Flyway, Kafka ...)
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:                     # stuck? -> restart the container
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:                    # not ready (starting, shutting down)? -> no traffic from the Service
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: grocery
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
