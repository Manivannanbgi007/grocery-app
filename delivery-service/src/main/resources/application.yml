# =====================================================================
# delivery-service configuration
#
# Every environment-specific value uses ${ENV_VARIABLE:local-default}.
# Locally the defaults just work; Kubernetes overrides them with
# environment variables (ConfigMaps / Secrets) - no code change needed.
# =====================================================================

server:
  port: ${SERVER_PORT:8110}
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true   # Tomcat's thread metrics (tomcat_threads_busy_threads ...) for Grafana and alerts

spring:
  application:
    name: delivery-service
  profiles:
    default: local        # used when no profile is set, e.g. when you press Run in the IDE

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/delivery_db?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:delivery_user}
    password: ${DB_PASSWORD:delivery_pass}
    # Connection pool (HikariCP). MySQL allows 300 connections for all services together: the budget is in
    # docs/resilience.md ("Database connections").
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}   # at most 10 connections per instance
      minimum-idle: ${DB_POOL_MIN_IDLE:2}         # only 2 stay open while the service is idle
      connection-timeout: 5000                    # ms a request waits for a free connection, then fails (503), instead of hanging
      idle-timeout: 300000                        # ms: connections above minimum-idle are closed after 5 unused minutes
      max-lifetime: 1800000                       # ms: each connection is renewed after 30 min (MySQL drops idle ones after 8 h)
      leak-detection-threshold: 20000             # ms: WARN with the stack trace when one connection is held longer
      data-source-properties:
        connectTimeout: 5000                      # ms to open the connection to MySQL
        socketTimeout: 60000                      # ms one query may take before the driver gives up: no endless wait on a dead connection

  # Every transaction must finish within 30 s: a query still running then is cancelled (KILL QUERY) and the
  # transaction rolls back, so a stuck query cannot hold a database connection for ever.
  transaction:
    default-timeout: 30s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate  # Flyway owns the schema; Hibernate only checks that entities match it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50

  flyway:
    locations: classpath:db/migration

  data:
    web:
      pageable:
        max-page-size: 100
    # Redis: which partners are online (keys that expire by themselves)
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:delivery}  # a Redis user that may only use the delivery:* keys and the tracking channel
      password: ${REDIS_PASSWORD:delivery_pass}
      timeout: 1s                  # a Redis command that takes longer fails (partner counted offline, or 503)
      connect-timeout: 1s          # (RedisClientConfig: no waiting at all while the connection is down)

  servlet:
    multipart:
      max-file-size: 5MB       # one proof-of-delivery photo
      max-request-size: 6MB

  # Kafka: this service PUBLISHES through its outbox table + Debezium, and CONSUMES
  # grocery.user.events (new partners) and grocery.order.events (orders ready for pickup, cancellations).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    listener:
      observation-enabled: true      # a span per event, continuing the trace from the "traceparent" header
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest      # a new consumer group starts from the oldest event
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: com.grocery.delivery.messaging.consumer.KnownEventsAvroDeserializer
        specific.avro.reader: true     # give us the generated classes (OrderReadyForPickup ...), not generic records

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}     # share of requests that are traced (lower it in production)
    export:
      otlp:
        enabled: ${TRACING_EXPORT_ENABLED:false}            # true when Jaeger runs (start-infra.ps1 -Profiles monitoring)
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}   # Jaeger's OTLP receiver (HTTP)
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true   # response-time buckets: p95/p99 in Grafana and alerts, sample requests link to traces
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true     # /actuator/health/liveness and /actuator/health/readiness (Kubernetes probes)

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    correlation: "[%X{correlationId:-}] [%X{traceId:-}] "   # correlation id (CorrelationIdFilter) and trace id in every log line

app:
  # Logging (logback-spring.xml, docs/observability.md)
  logging:
    format: ${LOG_FORMAT:text}   # console: text (people) or json (ECS, one object per line, for a log collector)
    # LoggingAspect (logging/LoggingAspect.java): calls that take longer are logged as WARN "SLOW"
    slow-call-threshold: ${LOG_SLOW_CALL_THRESHOLD:1s}
    loki:
      enabled: ${LOKI_ENABLED:false}                             # true = also push every log line to Grafana Loki
      url: ${LOKI_URL:http://localhost:3100/loki/api/v1/push}    # Loki's push API (start-infra.ps1 -Profiles monitoring)
      environment: ${LOKI_ENVIRONMENT:local}                     # the "env" label in Loki: local, test, prod ...
  # HousekeepingJob: deletes old rows of the event tables (docs/resilience.md, "Event tables")
  housekeeping:
    cron: "${HOUSEKEEPING_CRON:0 15 * * * *}"                                 # every hour at minute 15
    outbox-retention: ${HOUSEKEEPING_OUTBOX_RETENTION:14d}                    # twice the binlog's 7 days
    processed-event-retention: ${HOUSEKEEPING_PROCESSED_EVENT_RETENTION:30d}  # longer than an old event can come back
  delivery:
    online-for: 30m              # "go online" lasts this long; the partner app repeats the call to stay online
    time-zone: Asia/Kolkata      # day boundaries of the earnings report
  # Live delivery tracking (docs/delivery-tracking.md). The partner's position lives in Redis, never in MySQL.
  tracking:
    location-ttl: 2h                       # Redis forgets a position after this long without an update
    min-update-interval: 2s                # faster updates are skipped
    max-location-age: 10m                  # older positions (sent late by a phone that was offline) are refused
    max-accuracy-meters: ${TRACKING_MAX_ACCURACY_METERS:1000}   # less precise positions are refused
    heartbeat-interval: 15s                # keep-alive on every live stream
    stream-timeout: 30m                    # a stream closes after this; the browser reconnects by itself
    max-streams: ${TRACKING_MAX_STREAMS:2000}    # open live streams per instance
    routing:
      url: ${TRACKING_ROUTING_URL:}        # an OSRM-compatible server; empty = no route along streets, no arrival time
      timeout: 3s
      recalculate-after-meters: 150
      recalculate-after: 60s
  media:
    upload-dir: ${MEDIA_UPLOAD_DIR:./uploads}                                     # proof-of-delivery photos
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:8080/delivery-media}  # loaded through the gateway
