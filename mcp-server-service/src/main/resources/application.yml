# =====================================================================
# mcp-server-service configuration
#
# Every environment-specific value uses ${ENV_VARIABLE:local-default}.
# Locally the defaults just work; Kubernetes overrides them with
# environment variables (ConfigMaps / Secrets) - no code change needed.
# =====================================================================

server:
  port: ${SERVER_PORT:8115}
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true   # Tomcat's thread metrics (tomcat_threads_busy_threads ...) for Grafana and alerts

spring:
  application:
    name: mcp-server-service
  profiles:
    default: local        # used when no profile is set, e.g. when you press Run in the IDE

  # ----- The MCP server (Spring AI) -----
  ai:
    mcp:
      server:
        name: grocery-tools
        version: 1.0.0
        # What the server offers, sent to the client when it connects
        instructions: >-
          Tools of the Fresh Grocery shop. Read-only: products, prices, stock, reviews, categories,
          offers (coupons), delivery rules and stores; and, with the user's login, a customer's cart and orders,
          a vendor's store, a delivery partner's deliveries and earnings, and the admins' numbers.
          With a customer's login, one tool changes that customer's own cart (it adds a product), and five prepare a
          summary (an order, a cancellation, a new amount of a product, a product to take out, emptying the cart) that
          only the customer's own click on the website carries out; no other tool changes any data. All data comes
          live from the shop's services.
        type: SYNC              # tools are plain (blocking) Java methods
        # STATELESS = Streamable HTTP without sessions: every POST /mcp stands on its own, so several instances
        # can run behind a load balancer. (It cannot send requests back to the client, which we do not need.)
        protocol: STATELESS
        streamable-http:
          mcp-endpoint: /mcp
        request-timeout: 20s    # longer than the gateway calls (2 s connect + 5 s read), shorter than the client's 30 s
        capabilities:           # this server only offers tools
          tool: true
          resource: false
          prompt: false
          completion: false

  # Timeouts for every call to the API gateway (see RestClientConfig)
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s

  # A short cache for data that rarely changes (categories, stores, settings, coupons): fewer gateway calls.
  # One minute keeps "open now" and new coupons almost up to date. Product searches are never cached (stock changes).
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=200,expireAfterWrite=1m

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}     # share of requests that are traced (lower it in production)
    export:
      otlp:
        enabled: ${TRACING_EXPORT_ENABLED:false}            # true when Jaeger runs (start-infra.ps1 -Profiles monitoring)
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}   # Jaeger's OTLP receiver (HTTP)
  observations:
    enable:
      "[spring.security]": false     # no spans for every security filter step: they made each trace hard to read
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true   # response-time buckets: p95/p99 in Grafana and alerts, sample requests link to traces
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true     # /actuator/health/liveness and /actuator/health/readiness (Kubernetes probes)

logging:
  pattern:
    correlation: "[%X{correlationId:-}] [%X{traceId:-}] "   # correlation id (CorrelationIdFilter) and trace id in every log line
  level:
    # This server offers only tools; without these lines Spring AI warns at every start that it found no
    # resources, prompts or completions. (Tool problems are still logged.)
    org.springframework.ai.mcp.annotation.provider.resource: ERROR
    org.springframework.ai.mcp.annotation.provider.prompt: ERROR
    org.springframework.ai.mcp.annotation.provider.complete: ERROR

app:
  # Logging (logback-spring.xml, docs/observability.md)
  logging:
    format: ${LOG_FORMAT:text}   # console: text (people) or json (ECS, one object per line, for a log collector)
    # LoggingAspect (logging/LoggingAspect.java): calls that take longer are logged as WARN "SLOW"
    slow-call-threshold: ${LOG_SLOW_CALL_THRESHOLD:1s}
    loki:
      enabled: ${LOKI_ENABLED:false}                             # true = also push every log line to Grafana Loki
      url: ${LOKI_URL:http://localhost:3100/loki/api/v1/push}    # Loki's push API (start-infra.ps1 -Profiles monitoring)
      environment: ${LOKI_ENVIRONMENT:local}                     # the "env" label in Loki: local, test, prod ...
  gateway:
    url: ${API_GATEWAY_URL:http://localhost:8080}
  security:
    # The shared secret mcp-client-service sends in the X-MCP-API-Key header. No default here on purpose:
    # outside the local profile the service does not start without MCP_API_KEY (at least 32 characters).
    mcp-api-key: ${MCP_API_KEY:}   # empty when the variable is missing, so the start fails with a clear message
