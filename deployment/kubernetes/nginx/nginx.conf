# Entry NGINX: the one address of the shop for the browser, http://localhost. It sends each request to one of the
# two clusters and skips a cluster that does not answer.
#
# It runs as a Docker container in kind's Docker network "kind" (scripts\k8s-entry-nginx.ps1), so it reaches each
# cluster's control-plane node by its container name. 30080 is the node port of each cluster's NGINX gateway.
#
#   Browser -> this NGINX (port 80) -> grocery-cluster-a-control-plane:30080 -> Gateway -> frontend / api-gateway
#                                   -> grocery-cluster-b-control-plane:30080 -> (the same)
#
# Failover: open-source NGINX has passive health checks only (active checks are an NGINX Plus feature). A request
# that cannot reach a cluster (refused, no answer within 2 s, or 502/503/504) is sent to the other cluster, and the
# failed cluster is skipped for 10 s. A POST is only resent when it never reached the first cluster, so an order is
# never placed twice.
events {}

http {
    # Docker's DNS server finds the cluster nodes by name. "valid=10s": look the names up again every 10 s, so a
    # cluster that was stopped (or created after this NGINX started) is noticed.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream grocery_clusters {
        zone grocery_clusters 64k;               # shared memory that "resolve" needs
        server grocery-cluster-a-control-plane:30080 resolve max_fails=1 fail_timeout=10s;
        server grocery-cluster-b-control-plane:30080 resolve max_fails=1 fail_timeout=10s;
        keepalive 16;                            # reuse connections to the clusters
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 6m;                 # product photos and proof-of-delivery photos

        location / {
            proxy_pass http://grocery_clusters;
            proxy_http_version 1.1;
            proxy_set_header Connection "";      # keep the connection to the cluster open (keepalive above)

            # Tell the cluster who asked: the API gateway's rate limit per IP reads X-Forwarded-For
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Failover to the other cluster (see the top of this file)
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            # The AI assistant may take up to 180 s; the live streams send a keep-alive every 15 s
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;

            # Pass every piece of an answer on at once. The live streams (vendor order queue, delivery tracking) need
            # it: their "X-Accel-Buffering: no" header is used up by the cluster's NGINX and never reaches this one.
            proxy_buffering off;
        }
    }
}
