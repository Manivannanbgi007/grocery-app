# Passwords and keys. These are the LOCAL development values (the same as the defaults in application.yml).
# In a real environment create this Secret from a secret store (Vault, AWS Secrets Manager, Sealed Secrets ...),
# never commit real values.
# kind stores Secrets unencrypted in its etcd; a production cluster needs encryption at rest and access rules (RBAC).
apiVersion: v1
kind: Secret
metadata:
  name: grocery-secrets
  namespace: grocery
  labels:
    app.kubernetes.io/part-of: grocery
type: Opaque
stringData:
  JWT_SECRET: local-dev-only-jwt-secret-change-me-0123456789
  # AES-256 key (32 bytes, Base64) of the password-reset token in PasswordResetRequested: auth-service encrypts,
  # notification-service decrypts. A real one: openssl rand -base64 32
  PASSWORD_RESET_EVENT_KEY: bG9jYWwtZGV2LW9ubHktY2hhbmdlLW1lLTAxMjM0NTY=
  # Social login (docs/social-login.md, "Set up a provider"): each provider's app credentials. Empty: no button
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  MICROSOFT_CLIENT_ID: ""
  MICROSOFT_CLIENT_SECRET: ""
  FACEBOOK_CLIENT_ID: ""
  FACEBOOK_CLIENT_SECRET: ""
  APPLE_CLIENT_ID: ""                # the Services ID
  APPLE_TEAM_ID: ""
  APPLE_KEY_ID: ""
  APPLE_PRIVATE_KEY: ""              # the content of the .p8 file
  AUTH_DB_PASSWORD: auth_pass
  CUSTOMER_DB_PASSWORD: customer_pass
  STORE_DB_PASSWORD: store_pass
  PRODUCT_DB_PASSWORD: product_pass
  INVENTORY_DB_PASSWORD: inventory_pass
  CART_DB_PASSWORD: cart_pass
  ORDER_DB_PASSWORD: order_pass
  PAYMENT_DB_PASSWORD: payment_pass
  DELIVERY_DB_PASSWORD: delivery_pass
  NOTIFICATION_DB_PASSWORD: notification_pass
  REPORT_DB_PASSWORD: report_pass
  PLATFORM_DB_PASSWORD: platform_pass
  CHAT_DB_PASSWORD: chat_pass
  # Redis users (infrastructure/docker-compose.yml, redis: --user lines)
  REDIS_GATEWAY_PASSWORD: gateway_pass
  REDIS_DELIVERY_PASSWORD: delivery_pass
  # Shared secret between mcp-client-service and mcp-server-service (at least 32 characters).
  MCP_API_KEY: local-dev-mcp-api-key-0123456789abcdef
  RAZORPAY_KEY_SECRET: replace_me
  RAZORPAY_WEBHOOK_SECRET: replace_me
