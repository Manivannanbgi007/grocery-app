# Settings every service reads (each service only uses the ones it needs). Passwords are in secret.yaml.
# These values run the services in the two LOCAL kind clusters against the Docker Compose infrastructure on your
# machine: both clusters share the same MySQL, Kafka, Redis and Elasticsearch, so they work on the same data.
# For a real environment, point them at the managed MySQL, Kafka, Redis ... and use the "prod" profile.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grocery-config
  namespace: grocery
  labels:
    app.kubernetes.io/part-of: grocery
data:
  # "local" = also load the seed data (the local databases already contain it). Use "prod" with empty databases.
  SPRING_PROFILES_ACTIVE: local
  # On "java.lang.OutOfMemoryError" stop the JVM, so Kubernetes restarts the pod instead of leaving it half-broken
  JAVA_TOOL_OPTIONS: "-XX:+ExitOnOutOfMemoryError"
  MYSQL_HOST: host.docker.internal
  MYSQL_PORT: "3307"
  KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:9094      # Kafka's listener for containers (see docker-compose.yml)
  SCHEMA_REGISTRY_URL: http://host.docker.internal:8081
  REDIS_HOST: host.docker.internal
  REDIS_PORT: "6379"
  ELASTICSEARCH_URIS: http://host.docker.internal:9200
  MAIL_HOST: host.docker.internal
  MAIL_PORT: "1025"
  # How browsers reach the shop: the entry NGINX in front of both clusters (nginx/nginx.conf). Image and photo URLs
  # are built from it, so they keep working whichever cluster answers.
  PUBLIC_BASE_URL: http://localhost
  # The shop and the API share one address, so the browser needs no CORS for them. These are the other pages that
  # may call the API: each cluster directly (8281, 8282) and the Vite dev server (5173).
  CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:8281,http://localhost:8282,http://localhost:5173
  # Live delivery tracking (delivery-service): an OSRM-compatible routing server for the route along the streets and the
  # arrival time. Empty = off (the map draws a straight line, no arrival time). docs/delivery-tracking.md
  TRACKING_ROUTING_URL: ""
  # Traces to Jaeger (OTLP over HTTP). "true" once Jaeger runs (start-infra.ps1 -Profiles monitoring).
  # In production: the OpenTelemetry Collector or Jaeger of the cluster, and a lower sampling probability (e.g. 0.1).
  TRACING_SAMPLING_PROBABILITY: "1.0"
  TRACING_EXPORT_ENABLED: "false"
  OTLP_TRACING_ENDPOINT: http://host.docker.internal:4318/v1/traces
  # Logs to Grafana Loki (logback-spring.xml of every service). "true" once Loki runs (start-infra.ps1 -Profiles monitoring);
  # with "false" the logs go only to the console (kubectl logs).
  LOKI_ENABLED: "false"
  LOKI_URL: http://host.docker.internal:3100/loki/api/v1/push
  LOKI_ENVIRONMENT: kind                                 # the "env" label in Loki, to tell the clusters' logs apart from local runs
  # (LOG_SLOW_CALL_THRESHOLD is not set here on purpose: 1s by default, 60s in mcp-client-service)
