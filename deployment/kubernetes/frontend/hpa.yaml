# frontend: how many pods. At least 3, at most 5. Kubernetes adds a pod when the pods use more than 70 % of their
# CPU request (50m in deployment.yaml) on average. Needs the Metrics Server (addons/metrics-server).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: grocery
  labels:
    app: frontend
    app.kubernetes.io/part-of: grocery
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 3
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
