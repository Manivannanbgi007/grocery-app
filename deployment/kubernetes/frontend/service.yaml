# frontend: a stable name inside the cluster for the shop's NGINX pods: http://frontend (port 80).
# Only the Gateway calls it (gateway/routes.yaml); it is not reachable from outside the cluster by itself.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: grocery
  labels:
    app: frontend
    app.kubernetes.io/part-of: grocery
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
