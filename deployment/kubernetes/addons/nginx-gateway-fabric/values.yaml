# NGINX Gateway Fabric (the cluster's entry point, Gateway API): Helm settings for a kind cluster.
# Installed by scripts\k8s-create-clusters.ps1:
#   helm install ngf oci://ghcr.io/nginx/charts/nginx-gateway-fabric --version 2.8.0 -n nginx-gateway --create-namespace -f values.yaml
# The controller runs in the namespace "nginx-gateway"; for our Gateway (gateway/gateway.yaml) it starts NGINX pods
# in the namespace "grocery" (Deployment and Service "grocery-nginx").
nginx:
  replicas: 2                    # two NGINX pods: one can restart while the other keeps the shop reachable
  service:
    type: NodePort               # kind has no cloud load balancer: a fixed port on every node instead
    # "Cluster": a request arriving on any node is passed to an NGINX pod on any node. kind sends your
    # localhost:8281 to the control-plane node, but the NGINX pods run on the workers. ("Local" would drop it.)
    externalTrafficPolicy: Cluster
    nodePorts:
      - port: 30080              # clusters/cluster-*.yaml map this node port to localhost:8281 (A) / 8282 (B)
        listenerPort: 80         # the Gateway's listener (gateway/gateway.yaml)
