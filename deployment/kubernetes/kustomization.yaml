# Everything the grocery shop needs in ONE cluster. Both clusters get exactly the same; only the context changes:
#   kubectl --context kind-grocery-cluster-a apply -k deployment/kubernetes
#   kubectl --context kind-grocery-cluster-b apply -k deployment/kubernetes
# One service alone works too:  kubectl --context kind-grocery-cluster-a apply -f deployment/kubernetes/services/cart-service/
# Not listed here: clusters/ (kind configs), addons/ (installed once per cluster) and nginx/ (runs outside the
# clusters). scripts\k8s-create-clusters.ps1 and scripts\k8s-deploy.ps1 do all of it; see README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Namespace, shared settings, passwords, network rule
  - base/namespace.yaml
  - base/configmap.yaml
  - base/secret.yaml
  - base/network-policy.yaml

  # The 16 Spring Boot services (deployment.yaml = the pods, service.yaml = their name inside the cluster)
  - services/api-gateway/deployment.yaml
  - services/api-gateway/service.yaml
  - services/api-gateway/hpa.yaml
  - services/api-gateway/pdb.yaml
  - services/auth-service/deployment.yaml
  - services/auth-service/service.yaml
  - services/customer-service/deployment.yaml
  - services/customer-service/service.yaml
  - services/store-service/deployment.yaml
  - services/store-service/service.yaml
  - services/product-service/deployment.yaml
  - services/product-service/service.yaml
  - services/product-read-service/deployment.yaml
  - services/product-read-service/service.yaml
  - services/product-read-service/hpa.yaml
  - services/product-read-service/pdb.yaml
  - services/inventory-service/deployment.yaml
  - services/inventory-service/service.yaml
  - services/cart-service/deployment.yaml
  - services/cart-service/service.yaml
  - services/order-service/deployment.yaml
  - services/order-service/service.yaml
  - services/payment-service/deployment.yaml
  - services/payment-service/service.yaml
  - services/delivery-service/deployment.yaml
  - services/delivery-service/service.yaml
  - services/notification-service/deployment.yaml
  - services/notification-service/service.yaml
  - services/report-service/deployment.yaml
  - services/report-service/service.yaml
  - services/platform-service/deployment.yaml
  - services/platform-service/service.yaml
  - services/mcp-server-service/deployment.yaml
  - services/mcp-server-service/service.yaml
  - services/mcp-server-service/networkpolicy.yaml
  - services/mcp-client-service/deployment.yaml
  - services/mcp-client-service/service.yaml
  - services/mcp-client-service/networkpolicy.yaml

  # The React shop
  - frontend/deployment.yaml
  - frontend/service.yaml
  - frontend/hpa.yaml
  - frontend/pdb.yaml

  # The cluster's entry point and its routes (needs NGINX Gateway Fabric, addons/nginx-gateway-fabric)
  - gateway/gateway.yaml
  - gateway/routes.yaml
