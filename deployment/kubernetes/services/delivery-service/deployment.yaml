# delivery-service: the running pods (Deployment). service.yaml gives them a stable name inside the cluster:
# http://delivery-service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-service
  namespace: grocery
  labels:
    app: delivery-service
    app.kubernetes.io/part-of: grocery
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                        # a new version first starts one extra pod ...
      maxUnavailable: 0                  # ... and an old pod stops only when a new one is ready: no downtime
  selector:
    matchLabels:
      app: delivery-service
  template:
    metadata:
      labels:
        app: delivery-service
        app.kubernetes.io/part-of: grocery
      annotations:                       # a Prometheus in the cluster finds the metrics through these
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      automountServiceAccountToken: false  # the app never calls the Kubernetes API, so it gets no token
      terminationGracePeriodSeconds: 45    # preStop (10 s) + Spring Boot's graceful shutdown (up to 30 s)
      containers:
        - name: delivery-service
          image: grocery/delivery-service:0.0.1
          imagePullPolicy: IfNotPresent      # images are built locally and loaded into the cluster
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: grocery-config         # shared: profile, MySQL host, Kafka, Schema Registry, Redis, tracing ...
          env:
            - name: DB_URL
              value: "jdbc:mysql://$(MYSQL_HOST):$(MYSQL_PORT)/delivery_db?allowPublicKeyRetrieval=true&useSSL=false"
            - name: DB_USERNAME
              value: delivery_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: DELIVERY_DB_PASSWORD
            - name: REDIS_USERNAME             # a Redis user that may only use the delivery:* keys and the tracking channel
              value: delivery
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: REDIS_DELIVERY_PASSWORD
            - name: MEDIA_PUBLIC_BASE_URL
              value: "$(PUBLIC_BASE_URL)/delivery-media"
            - name: MEDIA_UPLOAD_DIR
              value: /app/uploads
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"                       # at most one CPU core
              memory: 640Mi                  # the JVM uses 75 % of it as heap (-XX:MaxRAMPercentage=75 in the Dockerfile)
          # Spring Boot's health groups (management.endpoint.health.probes.enabled=true)
          startupProbe:                      # up to 5 minutes to start (Flyway, Kafka; many pods start at once)
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3                # each check may take 3 s (the default 1 s is too short for a busy JVM)
            failureThreshold: 60
          livenessProbe:                     # stuck? -> restart the container
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5                # a slow answer (GC pause, busy node) is not "stuck": restart only after 3 x 10 s
            failureThreshold: 3
          readinessProbe:                    # not ready (starting, shutting down)? -> no traffic from the Service
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 10                  # on "stop", keep serving 10 s while the Service and the Gateway drop this pod
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          hostPath:                    # proof-of-delivery photos: a folder on your machine that every pod of both clusters shares
            path: /grocery-files/delivery-uploads   # (mounted into the nodes by clusters/cluster-*.yaml)
            type: Directory            # production: object storage (S3) or a ReadWriteMany volume
