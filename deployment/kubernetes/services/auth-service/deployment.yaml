# auth-service: the running pods (Deployment). service.yaml gives them a stable name inside the cluster:
# http://auth-service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: grocery
  labels:
    app: auth-service
    app.kubernetes.io/part-of: grocery
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                        # a new version first starts one extra pod ...
      maxUnavailable: 0                  # ... and an old pod stops only when a new one is ready: no downtime
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        app.kubernetes.io/part-of: grocery
      annotations:                       # a Prometheus in the cluster finds the metrics through these
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      automountServiceAccountToken: false  # the app never calls the Kubernetes API, so it gets no token
      terminationGracePeriodSeconds: 45    # preStop (10 s) + Spring Boot's graceful shutdown (up to 30 s)
      containers:
        - name: auth-service
          image: grocery/auth-service:0.0.1
          imagePullPolicy: IfNotPresent      # images are built locally and loaded into the cluster
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: grocery-config         # shared: profile, MySQL host, Kafka, Schema Registry, Redis, tracing ...
          env:
            - name: DB_URL
              value: "jdbc:mysql://$(MYSQL_HOST):$(MYSQL_PORT)/auth_db?allowPublicKeyRetrieval=true&useSSL=false"
            - name: DB_USERNAME
              value: auth_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: AUTH_DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: JWT_SECRET
            - name: PASSWORD_RESET_EVENT_KEY       # the same key as notification-service's
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: PASSWORD_RESET_EVENT_KEY
            # Social login (docs/social-login.md): off until "true"; the address people open the shop at (the providers'
            # redirect addresses are built from it), and each provider's credentials (empty in the Secret: no button)
            - name: SOCIAL_LOGIN_ENABLED
              value: "false"
            - name: APP_PUBLIC_URL
              value: http://localhost:5173
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: MICROSOFT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: MICROSOFT_CLIENT_ID
            - name: MICROSOFT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: MICROSOFT_CLIENT_SECRET
            - name: FACEBOOK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: FACEBOOK_CLIENT_ID
            - name: FACEBOOK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: FACEBOOK_CLIENT_SECRET
            - name: APPLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: APPLE_CLIENT_ID
            - name: APPLE_TEAM_ID
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: APPLE_TEAM_ID
            - name: APPLE_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: APPLE_KEY_ID
            - name: APPLE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: APPLE_PRIVATE_KEY
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"                       # at most one CPU core
              memory: 640Mi                  # the JVM uses 75 % of it as heap (-XX:MaxRAMPercentage=75 in the Dockerfile)
          # Spring Boot's health groups (management.endpoint.health.probes.enabled=true)
          startupProbe:                      # up to 5 minutes to start (Flyway, Kafka; many pods start at once)
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3                # each check may take 3 s (the default 1 s is too short for a busy JVM)
            failureThreshold: 60
          livenessProbe:                     # stuck? -> restart the container
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5                # a slow answer (GC pause, busy node) is not "stuck": restart only after 3 x 10 s
            failureThreshold: 3
          readinessProbe:                    # not ready (starting, shutting down)? -> no traffic from the Service
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 10                  # on "stop", keep serving 10 s while the Service and the Gateway drop this pod
