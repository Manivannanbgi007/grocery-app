# auth-service: a stable name inside the cluster for the pods of deployment.yaml:
# http://auth-service (port 80 -> the pods' port 8080). Kubernetes sends each connection to a ready pod.
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: grocery
  labels:
    app: auth-service
    app.kubernetes.io/part-of: grocery
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 80
      targetPort: http
