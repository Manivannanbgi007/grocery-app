# mcp-client-service: the AI shopping assistant (chat API): the running pods (Deployment).
# service.yaml: http://mcp-client-service. networkpolicy.yaml: only the API gateway may call it, so every question
# passes the gateway's token check and chat limit.
# The model runs in Ollama, which stays in Docker Compose like the other infrastructure (start-infra.ps1 -Profiles ai).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-client-service
  namespace: grocery
  labels:
    app: mcp-client-service
    app.kubernetes.io/part-of: grocery
spec:
  replicas: 1                                # conversations live in MySQL, so more replicas just work
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                        # a new version first starts one extra pod ...
      maxUnavailable: 0                  # ... and an old pod stops only when a new one is ready: no downtime
  selector:
    matchLabels:
      app: mcp-client-service
  template:
    metadata:
      labels:
        app: mcp-client-service
        app.kubernetes.io/part-of: grocery
      annotations:                       # a Prometheus in the cluster finds the metrics through these
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      automountServiceAccountToken: false  # the app never calls the Kubernetes API, so it gets no token
      terminationGracePeriodSeconds: 45    # preStop (10 s) + Spring Boot's graceful shutdown (up to 30 s)
      containers:
        - name: mcp-client-service
          image: grocery/mcp-client-service:0.0.1
          imagePullPolicy: IfNotPresent      # images are built locally and loaded into the cluster
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: grocery-config         # shared: profile, MySQL host, tracing ...
          env:
            - name: DB_URL
              value: "jdbc:mysql://$(MYSQL_HOST):$(MYSQL_PORT)/chat_db?allowPublicKeyRetrieval=true&useSSL=false"
            - name: DB_USERNAME
              value: chat_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: CHAT_DB_PASSWORD
            - name: OLLAMA_BASE_URL          # Ollama in Docker Compose on your machine
              value: "http://host.docker.internal:11434"
            - name: OLLAMA_CHAT_MODEL        # the same model as OLLAMA_CHAT_MODEL in infrastructure/.env
              value: "qwen3:4b-instruct-2507-q4_K_M"
            - name: SPEECH_BASE_URL          # speaches (voice) in Docker Compose on your machine, like Ollama
              value: "http://host.docker.internal:8000"
            - name: MCP_SERVER_URL
              value: "http://mcp-server-service"
            - name: MCP_API_KEY              # the shared secret for mcp-server-service
              valueFrom:
                secretKeyRef:
                  name: grocery-secrets
                  key: MCP_API_KEY
            - name: CHAT_MAX_CONCURRENT      # questions answered at the same time by ONE replica
              value: "4"
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"                       # at most one CPU core
              memory: 640Mi                  # the JVM uses 75 % of it as heap (-XX:MaxRAMPercentage=75 in the Dockerfile)
          # Readiness does not include Ollama or mcp-server-service: when they are down, the service still answers
          # quickly with 503 "not available right now", which is better than no answer at all.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3                # each check may take 3 s (the default 1 s is too short for a busy JVM)
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5                # a slow answer (GC pause, busy node) is not "stuck": restart only after 3 x 10 s
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 10                  # on "stop", keep serving 10 s while the Service and the Gateway drop this pod
