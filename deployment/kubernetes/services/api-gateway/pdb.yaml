# api-gateway: keep at least 2 pods running during planned maintenance (kubectl drain of a node, cluster upgrades).
# Kubernetes then moves the pods one at a time. It does not protect against crashes; replicas do that.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: grocery
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: grocery
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api-gateway
