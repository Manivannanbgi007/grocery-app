# api-gateway: how many pods. At least 3 (every request of the shop passes the gateway), at most 5.
# Kubernetes adds a pod when the pods use more than 70 % of their CPU request (250m in deployment.yaml) on average,
# and removes one again after 5 minutes below it. Needs the Metrics Server (addons/metrics-server).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: grocery
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: grocery
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 3
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
