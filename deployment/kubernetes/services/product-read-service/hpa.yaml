# product-read-service: how many pods. At least 3 (search and browsing are the busiest part of the shop), at most 5.
# Kubernetes adds a pod when the pods use more than 70 % of their CPU request (250m in deployment.yaml) on average,
# and removes one again after 5 minutes below it. Needs the Metrics Server (addons/metrics-server).
# More pods also share the catalog events: Kafka splits the topic's 3 partitions between them.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product-read-service
  namespace: grocery
  labels:
    app: product-read-service
    app.kubernetes.io/part-of: grocery
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product-read-service
  minReplicas: 3
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
